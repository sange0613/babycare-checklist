const KEY="babycare_checklist_parts_v2";let rows;try{rows=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){rows=initial}
const statuses=["未准备","已有·未装包","已装包","无需准备"];
function save(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const categorySelect=document.getElementById("category");const selectedCategory=categorySelect.value;categorySelect.innerHTML='<option value="">全部分类</option>'+[...new Set(rows.map(x=>x.category))].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");categorySelect.value=[...categorySelect.options].some(o=>o.value===selectedCategory)?selectedCategory:"";const part=document.getElementById("part").value;const f=document.getElementById("filter").value,c=document.getElementById("category").value,q=document.getElementById("search").value.trim().toLowerCase();let r=rows.filter(x=>(!part||x.category.startsWith(part)||(part==="宝宝用品"&&x.category.startsWith("宝宝床品")))&&(!f||x.status===f)&&(!c||x.category===c)&&(!q||(x.name+(x.target||"")+(x.have||"")+x.category).toLowerCase().includes(q)));document.getElementById("list").innerHTML=r.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="small"><span class="tag">${esc(x.category)}</span>${x.source?`<span class="tag">${esc(x.source)}</span>`:""}${esc((x.target||x.qty||""))}</div><input class="notes" placeholder="备注（如装在哪个包）" value="${esc(x.note||"")}" onchange="update(${x.id},'note',this.value)"><div class="small">实际数量：<input style="width:125px" aria-label="实际数量" value="${esc(x.have||'')}" placeholder="例如2包" onchange="update(${x.id},'have',this.value)"></div><div class="small"><button onclick="editItem(${x.id})">编辑</button> <button onclick="removeItem(${x.id})">删除</button></div></div><select onchange="update(${x.id},'status',this.value)">${statuses.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"<p>没有符合条件的物品。</p>";const count=s=>rows.filter(x=>x.status===s).length;document.getElementById("total").textContent=rows.length;document.getElementById("owned").textContent=count("已有·未装包")+count("已装包");document.getElementById("packed").textContent=count("已装包");document.getElementById("missing").textContent=count("未准备");document.getElementById("progress").style.width=(rows.length?100*count("已装包")/rows.length:0)+"%"}
function update(id,k,v){let x=rows.find(x=>x.id===id);if(x){x[k]=v;save()}}
function addItem(){let n=prompt("物品名称");if(!n||!n.trim())return;let q=prompt("数量/规格","1个")||"";rows.push({id:Math.max(0,...rows.map(x=>x.id))+1,category:"通用",name:n.trim(),qty:q,status:"未准备",source:"自行添加",target:q,have:""});save()}
function editItem(id){let x=rows.find(x=>x.id===id);let n=prompt("物品名称",x.name);if(n===null||!n.trim())return;let q=prompt("数量/规格",(x.target||x.qty||""));if(q===null)return;let c=prompt("分类（例如：妈妈用品｜清洁护理、宝宝用品｜喂养、证件及出院、通用）",x.category);if(c===null)return;x.name=n;x.target=q;x.category=c;save()}
function removeItem(id){if(confirm("确定删除这项吗？")){rows=rows.filter(x=>x.id!==id);save()}}
function download(name,body,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){download("待产包备份.json",JSON.stringify(rows,null,2),"application/json")}
function csv(){const cell=s=>'"'+String(s??"").replace(/"/g,'""')+'"';let lines=[["分类","物品","建议数量","已有数量","状态","来源","备注"],...rows.map(x=>[x.category,x.name,(x.target||x.qty||""),x.have||"",x.status,x.source,x.note||""])];download("待产包清单.csv","\ufeff"+lines.map(x=>x.map(cell).join(",")).join("\r\n"),"text/csv;charset=utf-8")}
document.getElementById("file").addEventListener("change",async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v)||!v.every(x=>x.name&&x.id&&x.status))throw Error();if(confirm("导入将替换当前清单，确定吗？")){rows=v;save()}}catch(e){alert("备份文件格式不正确")}e.target.value=""});
["search","filter","category","part"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",render));render();
